<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APAAR Student Verification</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f7fb;
      font-family: Arial, Helvetica, sans-serif;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      padding: 0 28px;
      border-radius: 12px;
      background: #123b63;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 8px 22px rgba(18, 59, 99, .18);
      transition: background .15s ease, transform .15s ease;
    }
    a:hover { background: #0b2946; transform: translateY(-1px); }
    a:focus-visible { outline: 3px solid #4b9dff; outline-offset: 4px; }
  </style>
</head>
<body>
  <a href="https://apaar-student-verification-demo.onrender.com">Open APAAR Student Verification</a>
</body>
</html>
